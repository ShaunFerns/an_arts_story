name: Publish the 3D game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Three.js library
        run: npm install --no-audit --no-fund --no-save three@0.160.0 playwright@1.56.1
      - name: Source Rathdown-centred OpenStreetMap snapshot
        run: node scripts/build-geodata.mjs
      - name: Prepare self-contained site assets
        run: |
          test -f index.html || { echo "::error::Upload the current game as index.html at repository root."; exit 1; }
          mkdir -p dist/vendor
          cp node_modules/three/build/three.module.js dist/vendor/three.module.js
          cp -R node_modules/three/examples/jsm dist/vendor/addons
          test -f review/index.html && test -s review/assets/student-rig.glb
          cp -R review dist/review
          mkdir -p dist/geo
          cp geo/index.html geo/data.json dist/geo/
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          pattern = r"const engineSources=\[.*?\];"
          replacement = "const engineSources=['./vendor/three.module.js'];"
          updated, count = re.subn(pattern, replacement, html, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Expected Three.js engineSources list not found: refusing to deploy')
          Path('dist/index.html').write_text(updated, encoding='utf-8')
          for name in ('offline_presentation.html',):
              src = Path(name)
              if src.exists():
                  (Path('dist') / name).write_bytes(src.read_bytes())
          PY
          touch dist/.nojekyll
      - name: Install Chromium for startup test
        run: npx playwright install --with-deps chromium
      - name: Verify 3D in browser
        run: |
          python3 -m http.server 8765 --directory dist > /tmp/arts-test-server.log 2>&1 &
          sleep 2
          node tests/smoke-test.mjs
          node tests/route-review-smoke.mjs
      - name: Attach location-review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: location-review-screenshots
          path: /tmp/arts-route-*.png
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Allow artifact registration
        run: sleep 15
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
